name: Build signed StudioMesa commercial AABs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD to create signed commercial bundles"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: studiomesa-commercial-release
  cancel-in-progress: false

jobs:
  build-signed-bundles:
    name: Test and build signed AABs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "BUILD" ]; then
            echo "Stopped: type BUILD in the workflow input to confirm."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fail closed: only sign a release from a commit whose full Android CI
      # (build, migration/auth checks, lint, and Android 8/16 UI tests) passed.
      - name: Require successful full CI for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?head_sha=$GITHUB_SHA&per_page=30")"
          python3 -c '
          import json, sys
          expected_sha = sys.argv[1]
          runs = json.load(sys.stdin).get("workflow_runs", [])
          passed = [
              run for run in runs
              if run.get("head_sha") == expected_sha
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not passed:
              print(
                  "Release blocked: full Android CI has not passed for this exact commit. "
                  "Wait for the Build StudioMesa Android APK workflow on main to finish successfully."
              )
              sys.exit(1)
          print(f"Verified successful full CI for commit {expected_sha}.")
          ' "$GITHUB_SHA" <<< "$response"

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: "8.11.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing secrets and keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STUDIOMESA_RELEASE_APPLICATION_ID: ${{ vars.STUDIOMESA_RELEASE_APPLICATION_ID }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD STUDIOMESA_RELEASE_APPLICATION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret/variable: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/studiomesa-release.jks"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "STUDIOMESA_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run unit tests for every distributed variant
        run: gradle --no-daemon testEssencialRestauranteDebugUnitTest testProfissionalRestauranteDebugUnitTest testProfissionalClienteDebugUnitTest testPremiumRestauranteDebugUnitTest testPremiumClienteDebugUnitTest

      - name: Run Android lint
        timeout-minutes: 10
        run: gradle --no-daemon lint

      - name: Build signed commercial bundles
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STUDIOMESA_RELEASE_APPLICATION_ID: ${{ vars.STUDIOMESA_RELEASE_APPLICATION_ID }}
        run: |
          set -euo pipefail
          gradle --no-daemon \
            -PstudiomesaCommercialRelease=true \
            -PstudiomesaReleaseApplicationId="$STUDIOMESA_RELEASE_APPLICATION_ID" \
            bundleEssencialRestauranteRelease \
            bundleProfissionalRestauranteRelease \
            bundleProfissionalClienteRelease \
            bundlePremiumRestauranteRelease \
            bundlePremiumClienteRelease
          mapfile -d '' bundles < <(find app/build/outputs/bundle -type f -name '*.aab' -print0)
          if [ "${#bundles[@]}" -ne 5 ]; then
            echo "Expected five AABs, found ${#bundles[@]}."
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            jarsigner -verify "$bundle"
          done
          sha256sum "${bundles[@]}" > release-checksums.txt

      - name: Upload signed AABs and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StudioMesa-Commercial-AABs
          path: |
            app/build/outputs/bundle/**/*.aab
            release-checksums.txt
          if-no-files-found: error
          retention-days: 14

      # The runner is ephemeral, but remove the private key file explicitly as
      # defense in depth, including when an earlier step failed.
      - name: Remove temporary release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/studiomesa-release.jks"
