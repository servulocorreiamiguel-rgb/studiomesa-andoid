name: Maintain StudioMesa Supabase (hidden heartbeat)

on:
  schedule:
    # Four small database calls per day, independent of Supabase itself.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-hidden-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Execute private heartbeat RPC
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL}" || { echo "Missing repository variable SUPABASE_URL"; exit 1; }
          test -n "${SUPABASE_ANON_KEY}" || { echo "Missing repository variable SUPABASE_ANON_KEY"; exit 1; }
          case "${SUPABASE_URL}" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL must be an HTTPS Supabase project URL"; exit 1 ;;
          esac

      - name: Send silent database heartbeat
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "${SUPABASE_URL%/}/rest/v1/rpc/studiomesa_keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}')"

          if [[ "${response}" != "true" ]]; then
            echo "Heartbeat returned an unexpected response."
            exit 1
          fi

          echo "Supabase database heartbeat completed successfully."
