name: Maintain StudioMesa Supabase (hidden heartbeat)

on:
  schedule:
    # A few genuine database API requests per day, independent of Supabase.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-hidden-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Execute read-only heartbeat RPC
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send silent database heartbeat
        shell: bash
        env:
          SUPABASE_URL: https://svwvkfsyevuyabelrtjk.supabase.co
          # Public legacy anon key only. Never place service_role here.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2d2d2
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "${SUPABASE_URL}/rest/v1/rpc/studiomesa_keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}')"

          if [[ "${response}" != "true" ]]; then
            echo "Heartbeat returned an unexpected response."
            exit 1
          fi

          echo "Supabase keepalive request completed successfully."
