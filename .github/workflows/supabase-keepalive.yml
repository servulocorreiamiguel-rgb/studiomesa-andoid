name: Maintain StudioMesa Supabase (hidden heartbeat)

on:
  schedule:
    # Four small database calls per day, independent of Supabase itself.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-hidden-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    # Keep disabled until the additive database migration is safely deployed.
    if: vars.SUPABASE_KEEPALIVE_ENABLED == 'true'
    name: Execute private heartbeat RPC
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send silent database heartbeat
        shell: bash
        env:
          SUPABASE_URL: https://svwvkfsyevuyabelrtjk.supabase.co
          # Supabase legacy anon key: public client key, never service_role.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2d3ZrZnN5ZXZ1eWFiZWxydGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjQ0NzIsImV4cCI6MjEwNDc0MDQ3Mn0.J90m-5tpxk5vOG62B_pv0ds8q8lsMGu4mdCJO7H13TA
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
            "${SUPABASE_URL}/rest/v1/rpc/studiomesa_keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}')"

          if [[ "${response}" != "true" ]]; then
            echo "Heartbeat returned an unexpected response."
            exit 1
          fi

          echo "Supabase database heartbeat completed successfully."
