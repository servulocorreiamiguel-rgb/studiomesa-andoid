name: Build StudioMesa Android APK

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Keep the newest build in flight; older queued builds should not delay the latest code.
concurrency:
  group: studiomesa-android-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate SQL migration function delimiters
        run: python3 scripts/check_sql_function_delimiters.py
      - name: Validate privileged SQL function security contracts
        run: python3 scripts/check_sql_security_definers.py
      - name: Test privileged SQL function security guard
        run: python3 -m unittest discover -s scripts -p 'test_check_*.py' -v
      - name: Validate Supabase Edge Function gateway settings
        run: python3 scripts/check_supabase_function_config.py
      - name: Validate restaurant AI assistant security gates
        run: python3 scripts/check_restaurant_ai_function.py

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.8"

      - name: Type-check restaurant AI Edge Function
        run: deno check supabase/functions/restaurant-ai-assistant/index.ts

      - name: Test restaurant AI request validation
        run: deno test supabase/functions/restaurant-ai-assistant/validation_test.ts

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"

      # Persist the Android debug keystore across workflow runs so that
      # future test APKs can update earlier test APKs without a signature mismatch.
      - name: Restore persistent debug signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: studiomesa-android-debug-signing-key-v1

      - name: Create debug signing key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "Android SDK command-line tools were not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile app
        run: gradle --no-daemon assembleEssencialRestauranteDebug assembleProfissionalRestauranteDebug assembleProfissionalClienteDebug assemblePremiumRestauranteDebug assemblePremiumClienteDebug

      - name: Run unit tests for every distributed variant
        run: gradle --no-daemon testEssencialRestauranteDebugUnitTest testProfissionalRestauranteDebugUnitTest testProfissionalClienteDebugUnitTest testPremiumRestauranteDebugUnitTest testPremiumClienteDebugUnitTest

      - name: Run Android lint
        timeout-minutes: 10
        run: gradle --no-daemon lint

      # Build all release combinations using a throwaway key; never publish these AABs.
      - name: Validate all commercial release variants
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/studiomesa-ci-release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          CI_KEY_PASSWORD="ci-only-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE_PATH" -storetype JKS \
            -storepass "$CI_KEY_PASSWORD" -alias "studiomesa-ci" \
            -keypass "$CI_KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=StudioMesa CI,O=Example,C=PT"
          export STUDIOMESA_KEYSTORE_PATH="$KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PASSWORD="$CI_KEY_PASSWORD"
          export ANDROID_KEY_ALIAS="studiomesa-ci"
          export ANDROID_KEY_PASSWORD="$CI_KEY_PASSWORD"
          gradle --no-daemon \
            -PstudiomesaCommercialRelease=true \
            -PstudiomesaReleaseApplicationId=pt.studiomesa.ci \
            bundleEssencialRestauranteRelease \
            bundleProfissionalRestauranteRelease \
            bundleProfissionalClienteRelease \
            bundlePremiumRestauranteRelease \
            bundlePremiumClienteRelease
          bundle_count="$(find app/build/outputs/bundle -type f -name '*.aab' | wc -l | tr -d ' ')"
          if [ "$bundle_count" -ne 5 ]; then
            echo "Expected five commercial-flavor test AABs, found $bundle_count." >&2
            exit 1
          fi
          while IFS= read -r bundle; do
            jarsigner -verify "$bundle"
          done < <(find app/build/outputs/bundle -type f -name '*.aab')
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StudioMesa-1.5.0-Demo-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke-tests:
    name: UI smoke tests on Android 16 emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on Android 16
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          script: gradle --no-daemon --max-workers=1 connectedEssencialRestauranteDebugAndroidTest connectedProfissionalRestauranteDebugAndroidTest connectedProfissionalClienteDebugAndroidTest connectedPremiumRestauranteDebugAndroidTest connectedPremiumClienteDebugAndroidTest

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StudioMesa-Android16-Emulator-Test-Results
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
          retention-days: 14

  android-8-smoke-tests:
    name: UI smoke tests on Android 8 (API 26)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on Android 8
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: google_apis
          arch: x86
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          script: gradle --no-daemon --max-workers=1 connectedEssencialRestauranteDebugAndroidTest connectedProfissionalRestauranteDebugAndroidTest connectedProfissionalClienteDebugAndroidTest connectedPremiumRestauranteDebugAndroidTest connectedPremiumClienteDebugAndroidTest

      - name: Upload Android 8 test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StudioMesa-Android8-Emulator-Test-Results
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
          retention-days: 14

  migration-replay-tests:
    name: Replay all Supabase migrations on empty PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studiomesa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studiomesa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: studiomesa_test
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Bootstrap isolated Supabase Auth compatibility shim
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --file scripts/ci/supabase_postgres_shim.sql

      - name: Replay migration history from an empty database
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r migration; do
            echo "Replaying ${migration}"
            psql --no-psqlrc --set ON_ERROR_STOP=1 --file "${migration}"
            count=$((count + 1))
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test "${count}" -eq 39
          echo "Successfully replayed ${count} versioned migration files."

      - name: Assert core schema, RLS and RPCs exist
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF to_regclass('public.restaurants') IS NULL
              OR to_regclass('public.restaurant_orders') IS NULL
              OR to_regclass('public.restaurant_reservations') IS NULL
              OR to_regclass('public.restaurant_inventory_items') IS NULL
              OR to_regclass('public.loyalty_members') IS NULL
              OR to_regclass('private.restaurant_join_codes') IS NULL THEN
              RAISE EXCEPTION 'Core StudioMesa tables are missing after clean migration replay.';
            END IF;

            IF to_regprocedure('public.create_restaurant(text,text)') IS NULL
              OR to_regprocedure('public.create_restaurant_reservation_idempotent(uuid,uuid,text,text,integer,timestamp with time zone,integer,integer,text)') IS NULL
              OR to_regprocedure('public.adjust_inventory_stock_idempotent(uuid,uuid,numeric,text)') IS NULL
              OR to_regprocedure('public.adjust_loyalty_points_idempotent(uuid,uuid,integer,text)') IS NULL THEN
              RAISE EXCEPTION 'A required RPC is missing after clean migration replay.';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relkind = 'r'
                AND NOT c.relrowsecurity
            ) THEN
              RAISE EXCEPTION 'At least one public table was created without RLS enabled.';
            END IF;
          END;
          $check$;
          SQL

      - name: Test cross-restaurant authorization and idempotency
        shell: bash
        run: bash scripts/ci/check_postgres_authorization_contracts.sh
