name: Build StudioMesa Android APK

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build three StudioMesa demo APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile all three demo APKs
        run: gradle --no-daemon assembleEssencialDebug assembleProfissionalDebug assemblePremiumDebug

      - name: Run Android Lint for all three variants
        run: gradle --no-daemon lintEssencialDebug lintProfissionalDebug lintPremiumDebug

      - name: Upload three demo APKs
        uses: actions/upload-artifact@v4
        with:
          name: StudioMesa-3-Demos
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
