name: Build StudioMesa Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Keep the newest build in flight; older queued builds should not delay the latest code.
concurrency:
  group: studiomesa-android-debug-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate SQL migration function delimiters
        run: python3 scripts/check_sql_function_delimiters.py

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      # Persist the Android debug keystore across workflow runs so that
      # future test APKs can update earlier test APKs without a signature mismatch.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: studiomesa-android-debug-signing-key-v1

      - name: Create debug signing key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "Android SDK command-line tools were not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile app
        run: gradle --no-daemon assembleEssencialRestauranteDebug assembleProfissionalRestauranteDebug assembleProfissionalClienteDebug assemblePremiumRestauranteDebug assemblePremiumClienteDebug

      - name: Run unit tests for every distributed variant
        run: gradle --no-daemon testEssencialRestauranteDebugUnitTest testProfissionalRestauranteDebugUnitTest testProfissionalClienteDebugUnitTest testPremiumRestauranteDebugUnitTest testPremiumClienteDebugUnitTest

      - name: Run Android lint
        timeout-minutes: 10
        run: gradle --no-daemon lint

      # Build one commercial variant with a throwaway CI key. This validates the
      # release Gradle/signing path without using or uploading the owner's key.
      - name: Validate commercial release configuration
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/studiomesa-ci-release.jks"
          CI_KEY_PASSWORD="ci-only-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE_PATH" -storetype JKS \
            -storepass "$CI_KEY_PASSWORD" -alias "studiomesa-ci" \
            -keypass "$CI_KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=StudioMesa CI,O=Example,C=PT"
          export STUDIOMESA_KEYSTORE_PATH="$KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PASSWORD="$CI_KEY_PASSWORD"
          export ANDROID_KEY_ALIAS="studiomesa-ci"
          export ANDROID_KEY_PASSWORD="$CI_KEY_PASSWORD"
          gradle --no-daemon \
            -PstudiomesaCommercialRelease=true \
            -PstudiomesaReleaseApplicationId=pt.studiomesa.ci \
            bundleEssencialRestauranteRelease
          find app/build/outputs/bundle -type f -name '*.aab' -print -quit | grep -q .
          rm -f "$KEYSTORE_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudioMesa-1.5.0-Demo-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke-tests:
    name: UI smoke tests on Android 16 emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on Android 16
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          script: gradle --no-daemon connectedEssencialRestauranteDebugAndroidTest connectedProfissionalRestauranteDebugAndroidTest connectedProfissionalClienteDebugAndroidTest connectedPremiumRestauranteDebugAndroidTest connectedPremiumClienteDebugAndroidTest

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudioMesa-Android16-Emulator-Test-Results
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
          retention-days: 14
