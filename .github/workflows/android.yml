name: Build StudioMesa Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Keep the newest build in flight; older queued builds should not delay the latest code.
concurrency:
  group: studiomesa-android-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test immutable GitHub Actions pin audit
        run: python3 scripts/test_check_github_action_pins.py

      - name: Audit immutable GitHub Actions pins
        run: python3 scripts/check_github_action_pins.py

      - name: Test commercial release workflow safeguards
        run: |
          python3 scripts/test_check_commercial_release_workflow.py
          python3 scripts/check_commercial_release_workflow.py
      - name: Validate SQL migration function delimiters
        run: python3 scripts/check_sql_function_delimiters.py

      - name: Audit Supabase migration security
        run: |
          python3 scripts/test_audit_supabase_security.py
          python3 scripts/audit_supabase_security.py

      - name: Audit Android HTTP transport safety
        run: |
          python3 scripts/test_check_android_http_safety.py
          python3 scripts/check_android_http_safety.py

      - name: Test Supabase Edge Function dependency pin audit
        run: python3 scripts/test_check_supabase_edge_dependency_pins.py

      - name: Audit Supabase Edge Function dependency pins
        run: python3 scripts/check_supabase_edge_dependency_pins.py

      - name: Test account deletion Edge Function security audit
        run: python3 scripts/test_check_account_deletion_security.py

      - name: Audit account deletion Edge Function security
        run: python3 scripts/check_account_deletion_security.py

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: "8.11.1"

      # Persist the Android debug keystore across workflow runs so that
      # future test APKs can update earlier test APKs without a signature mismatch.
      - name: Restore persistent debug signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: studiomesa-android-debug-signing-key-v1

      - name: Create debug signing key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "Android SDK command-line tools were not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile app
        run: gradle --no-daemon assembleEssencialRestauranteDebug assembleProfissionalRestauranteDebug assembleProfissionalClienteDebug assemblePremiumRestauranteDebug assemblePremiumClienteDebug

      - name: Run unit tests for every distributed variant
        run: gradle --no-daemon testEssencialRestauranteDebugUnitTest testProfissionalRestauranteDebugUnitTest testProfissionalClienteDebugUnitTest testPremiumRestauranteDebugUnitTest testPremiumClienteDebugUnitTest

      - name: Run Android lint
        timeout-minutes: 10
        run: gradle --no-daemon lint

      # Build one commercial variant with a throwaway CI key. This validates the
      # release Gradle/signing path without using or uploading the owner's key.
      - name: Validate commercial release configuration
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/studiomesa-ci-release.jks"
          CI_KEY_PASSWORD="ci-only-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE_PATH" -storetype JKS \
            -storepass "$CI_KEY_PASSWORD" -alias "studiomesa-ci" \
            -keypass "$CI_KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=StudioMesa CI,O=Example,C=PT"
          export STUDIOMESA_KEYSTORE_PATH="$KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PASSWORD="$CI_KEY_PASSWORD"
          export ANDROID_KEY_ALIAS="studiomesa-ci"
          export ANDROID_KEY_PASSWORD="$CI_KEY_PASSWORD"
          gradle --no-daemon \
            -PstudiomesaCommercialRelease=true \
            -PstudiomesaReleaseApplicationId=pt.studiomesa.ci \
            bundleEssencialRestauranteRelease \
            assembleEssencialRestauranteRelease
          AAB_PATH="$(find app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$AAB_PATH"
          verification_output="$(jarsigner -verify "$AAB_PATH" 2>&1)" || {
            printf '%s\n' "$verification_output"
            echo "CI AAB signature verification command failed."
            exit 1
          }
          printf '%s\n' "$verification_output"
          if ! grep -Fq "jar verified." <<< "$verification_output"; then
            echo "CI AAB is not confirmed as correctly signed."
            exit 1
          fi
          APK_PATH="$(find app/build/outputs/apk/essencialRestaurante/release -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"
          rm -f "$KEYSTORE_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StudioMesa-1.5.0-Demo-APKs
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke-tests:
    name: UI smoke tests on Android 16 emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on Android 16
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 50
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          script: set -eu; for test_task in connectedEssencialRestauranteDebugAndroidTest connectedProfissionalRestauranteDebugAndroidTest connectedProfissionalClienteDebugAndroidTest connectedPremiumRestauranteDebugAndroidTest connectedPremiumClienteDebugAndroidTest; do echo "STARTING_ANDROID_SMOKE_TASK=$test_task"; timeout --signal=TERM --kill-after=30s 8m gradle --no-daemon --max-workers=1 "$test_task"; echo "PASSED_ANDROID_SMOKE_TASK=$test_task"; done

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StudioMesa-Android16-Emulator-Test-Results
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
          retention-days: 14

  android-8-smoke-tests:
    name: UI smoke tests on Android 8 (API 26)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on Android 8
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 50
        with:
          api-level: 26
          target: google_apis
          arch: x86
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          script: set -eu; for test_task in connectedEssencialRestauranteDebugAndroidTest connectedProfissionalRestauranteDebugAndroidTest connectedProfissionalClienteDebugAndroidTest connectedPremiumRestauranteDebugAndroidTest connectedPremiumClienteDebugAndroidTest; do echo "STARTING_ANDROID_SMOKE_TASK=$test_task"; timeout --signal=TERM --kill-after=30s 8m gradle --no-daemon --max-workers=1 "$test_task"; echo "PASSED_ANDROID_SMOKE_TASK=$test_task"; done

      - name: Upload Android 8 test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StudioMesa-Android8-Emulator-Test-Results
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
          retention-days: 14

  migration-replay-tests:
    name: Replay migrations and test database authorization
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studiomesa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studiomesa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: studiomesa_test
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Bootstrap isolated Supabase Auth compatibility shim
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --file scripts/ci/supabase_postgres_shim.sql

      - name: Replay migration history from an empty database
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r migration; do
            echo "Replaying ${migration}"
            psql --no-psqlrc --set ON_ERROR_STOP=1 --file "${migration}"
            count=$((count + 1))
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test "${count}" -eq 43
          echo "Successfully replayed ${count} versioned migration files."

      - name: Assert core schema, RLS and RPCs exist
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF to_regclass('public.restaurants') IS NULL
              OR to_regclass('public.restaurant_orders') IS NULL
              OR to_regclass('public.restaurant_reservations') IS NULL
              OR to_regclass('public.restaurant_inventory_items') IS NULL
              OR to_regclass('public.loyalty_members') IS NULL
              OR to_regclass('private.restaurant_join_codes') IS NULL THEN
              RAISE EXCEPTION 'Core StudioMesa tables are missing after clean migration replay.';
            END IF;

            IF to_regprocedure('public.create_restaurant(text,text)') IS NULL
              OR to_regprocedure('public.create_restaurant_reservation_idempotent(uuid,uuid,text,text,integer,timestamp with time zone,integer,integer,text)') IS NULL
              OR to_regprocedure('public.adjust_inventory_stock_idempotent(uuid,uuid,numeric,text)') IS NULL
              OR to_regprocedure('public.adjust_loyalty_points_idempotent(uuid,uuid,integer,text)') IS NULL THEN
              RAISE EXCEPTION 'A required RPC is missing after clean migration replay.';
            END IF;

            IF to_regprocedure('public.save_inventory_item_with_cost(uuid,uuid,text,text,numeric,numeric,text,numeric)') IS NULL
              OR to_regprocedure('public.create_inventory_item_idempotent_with_cost(uuid,uuid,text,text,numeric,numeric,text,numeric)') IS NULL THEN
              RAISE EXCEPTION 'Cost-aware inventory RPCs are missing after clean migration replay.';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'restaurant_inventory_items'
                AND column_name = 'unit_cost_per_unit'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'restaurant_inventory_movements'
                AND column_name = 'unit_cost_at_movement'
            ) THEN
              RAISE EXCEPTION 'Inventory unit-cost or historical cost snapshot columns are missing.';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'restaurant_orders'
                AND column_name = 'menu_item_id'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'restaurant_orders'
                AND column_name = 'unit_cost_snapshot'
                AND is_nullable = 'YES'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'restaurant_orders_menu_item_same_restaurant_fk'
                AND conrelid = 'public.restaurant_orders'::regclass
            ) THEN
              RAISE EXCEPTION 'Stable order menu identity, nullable cost snapshot or same-restaurant constraint is missing.';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_trigger t
              JOIN pg_class c ON c.oid = t.tgrelid
              JOIN pg_proc p ON p.oid = t.tgfoid
              WHERE t.tgname = 'restaurant_inventory_movement_cost_snapshot'
                AND c.oid = 'public.restaurant_inventory_movements'::regclass
                AND NOT t.tgisinternal
                AND NOT p.prosecdef
            ) THEN
              RAISE EXCEPTION 'Inventory cost snapshot trigger is missing or runs with SECURITY DEFINER.';
            END IF;

            IF has_function_privilege(
              'anon',
              'public.save_inventory_item_with_cost(uuid,uuid,text,text,numeric,numeric,text,numeric)',
              'EXECUTE'
            ) OR has_function_privilege(
              'anon',
              'public.create_inventory_item_idempotent_with_cost(uuid,uuid,text,text,numeric,numeric,text,numeric)',
              'EXECUTE'
            ) OR NOT has_function_privilege(
              'authenticated',
              'public.save_inventory_item_with_cost(uuid,uuid,text,text,numeric,numeric,text,numeric)',
              'EXECUTE'
            ) OR NOT has_function_privilege(
              'authenticated',
              'public.create_inventory_item_idempotent_with_cost(uuid,uuid,text,text,numeric,numeric,text,numeric)',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'Cost-aware inventory RPC grants are not restricted to authenticated callers.';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relkind = 'r'
                AND NOT c.relrowsecurity
            ) THEN
              RAISE EXCEPTION 'At least one public table was created without RLS enabled.';
            END IF;
          END;
          $check$;
          SQL

      - name: Test cross-restaurant authorization and idempotency
        shell: bash
        run: bash scripts/ci/check_postgres_authorization_contracts.sh
