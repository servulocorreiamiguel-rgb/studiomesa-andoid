# AndroidX is required by the AndroidX Test and Espresso instrumentation test dependencies.
android.useAndroidX=true

# The five Android flavor builds compile large Kotlin sources in the same Gradle invocation.
# Give Gradle/Kotlin more heap and cap concurrent workers to avoid transient compiler OOMs in CI.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
